<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitFlow - Gym App</title>

  <!-- Add PWA requirements -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6C63FF">

  <style>
    :root {
      --primary: #6C63FF;
      --secondary: #FF6584;
      --success: #7CE38B;
      --pastel1: #F8F9FA;
      --pastel2: #E9ECEF;
      --text: #2D3436;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 20px;
      overflow-x: hidden;
      position: relative;
      min-height: 80vh;
    }

    .page {
      position: absolute;
      width: 90%;
      padding: 20px;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      transform: translateX(100%);
    }

    .page.active {
      opacity: 1;
      transform: translateX(0);
    }

    .page.prev {
      transform: translateX(-100%);
    }

    .page.next {
      transform: translateX(100%);
    }

    h1 {
      text-align: center;
      color: var(--text);
      margin-bottom: 25px;
      font-size: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 25px;
    }

    .pill {
      padding: 14px 20px;
      border-radius: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--pastel1);
      color: var(--text);
      border: 2px solid transparent;
      font-size: 0.9rem;
    }

    .pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .exercise-card {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }

    .exercise-card.completed {
      background: var(--success);
      opacity: 0.9;
    }

    .exercise-info {
      color: #666;
      font-size: 0.85rem;
    }

    .checkmark {
      width: 25px;
      height: 25px;
      border: 2px solid var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 10px;
    }

    .checkmark::after {
      content: "✓";
      color: white;
      font-size: 14px;
      display: none;
    }

    .completed .checkmark {
      background: var(--primary);
    }

    .completed .checkmark::after {
      display: block !important;
    }

    .well-done {
      text-align: center;
      padding: 40px 20px;
    }

    .restart-btn {
      background: var(--primary);
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      border: none;
      margin-top: 20px;
      cursor: pointer;
      font-size: 1rem;
    }

    .confetti {
      font-size: 40px;
      animation: confetti 2s infinite;
    }

    @keyframes confetti {

      0%,
      100% {
        transform: translateY(0) rotate(0);
      }

      25% {
        transform: translateY(-20px) rotate(15deg);
      }

      50% {
        transform: translateY(0) rotate(-15deg);
      }

      75% {
        transform: translateY(-10px) rotate(5deg);
      }
    }

    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      border-radius: 20px;
      background: var(--pastel2);
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
        border-radius: 15px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .pill {
        padding: 12px 15px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body>

    <!-- Page 1 - Body Parts -->

      <h1>Choose Focus Area 💪</h1>
      <div class="grid" id="bodyParts"></div>
    </div>

    <!-- Page 2 - Exercises -->

      <div class="back-button" onclick="showPage('page1')">← Back</div>

          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);

      const installButton = document.createElement('button');
      installButton.textContent = 'Install App';
      installButton.style.position = 'fixed';
      installButton.style.bottom = '20px';
      installButton.style.right = '20px';
      installButton.style.zIndex = '1000';
      installButton.onclick = () => {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted install');
          }
          deferredPrompt = null;
        });
      };
      document.body.appendChild(installButton);

    // Create manifest and service worker inline

    // Create dynamic manifest
    const manifestString = JSON.stringify(manifest);
    const manifestBlob = new Blob([manifestString], { type: 'application/json' });
    const manifestURL = URL.createObjectURL(manifestBlob);
    document.querySelector('link[rel="manifest"]').href = manifestURL;

    // Create service worker
    const serviceWorkerCode = `
      self.addEventListener('install', (event) => {
        event.waitUntil(
          caches.open('fitflow-v1').then((cache) => {
            return cache.addAll([
              '/',
              '/index.html',
              // Add other assets if needed
            ]);
          })
        );
      });

      self.addEventListener('fetch', (event) => {
        event.respondWith(
          caches.match(event.request).then((response) => {
            return response || fetch(event.request);
          })
        );
      });
    `;

    const serviceWorkerURL = URL.createObjectURL(serviceWorkerBlob);

    let currentWorkout = {
      bodyPart: null,
      intensity: 'beginner',
      exercises: []

    function initializeApp() {
      // Initialize body parts
      const bodyParts = ['legs', 'chest', 'back', 'biceps', 'triceps', 'shoulder', 'core', 'cardio'];
      const container = document.getElementById('bodyParts');
      bodyParts.forEach(part => {
        const pill = createPill(part, () => selectBodyPart(part));
        container.appendChild(pill);
      });

      // Initialize intensity levels
      const intensities = ['beginner', 'intermediate', 'advanced'];
      const intensityContainer = document.getElementById('intensity');
      intensities.forEach(level => {
        const pill = createPill(level, () => selectIntensity(level));
        intensityContainer.appendChild(pill);
      });
      intensityContainer.children[0].classList.add('active');
    }

    function createPill(text, onClick) {
      const pill = document.createElement('div');
      pill.className = 'pill';
      pill.textContent = text.charAt(0).toUpperCase() + text.slice(1);
      pill.addEventListener('click', onClick);
      return pill;
    }

    function selectBodyPart(part) {
      currentWorkout.bodyPart = part;
      document.getElementById('routineTitle').textContent =
        `${part.charAt(0).toUpperCase() + part.slice(1)} Workout`;
      selectIntensity('beginner');
      showPage('page2');
    }

    function selectIntensity(level) {
      currentWorkout.intensity = level;
      document.querySelectorAll('#intensity .pill').forEach(pill => {
        pill.classList.toggle('active', pill.textContent.toLowerCase() === level);
      });
      loadExercises();
    }

    function loadExercises() {
      const container = document.getElementById('exercises');
      container.innerHTML = '';
      const exercises = exercisesData[currentWorkout.bodyPart][currentWorkout.intensity];

      exercises.forEach(ex => {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        card.innerHTML = `
          <div>
            <div class="exercise-name">${ex.name}</div>
            <div class="exercise-info">
              ${ex.reps ? `${ex.reps} reps` : `${ex.duration}`} × ${ex.sets} sets
            </div>
          </div>
          <div class="checkmark"></div>
        `;
        card.addEventListener('click', () => toggleComplete(card));
        container.appendChild(card);
      });
    }

    function toggleComplete(card) {
      card.classList.toggle('completed');
      checkCompletion();
    }

    function checkCompletion() {
      const completed = document.querySelectorAll('.exercise-card.completed').length;
      const total = document.querySelectorAll('.exercise-card').length;
      if (completed === total && total > 0) showPage('page3');
    }

    function showPage(pageId) {
      const pages = document.querySelectorAll('.page');
      pages.forEach(page => {
        if (page.classList.contains('active')) {
          page.classList.remove('active');
          page.classList.add('prev');
        }
      });
      const newPage = document.getElementById(pageId);
      newPage.classList.add('active');
      newPage.classList.remove('prev');
    }

    function restartApp() {
      currentWorkout = { bodyPart: null, intensity: 'beginner' };
      document.querySelectorAll('.exercise-card.completed').forEach(card => {
        card.classList.remove('completed');
      });
      showPage('page1');
    }

    // Start the app
    initializeApp();
  </script>
